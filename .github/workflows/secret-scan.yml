# Scans every push and pull request for committed secrets (API keys, tokens, private keys,
# database URLs with passwords). Added by the 2026-11-10 security audit (checklist item 51).
# A failing run means a secret-like value was committed: rotate it at the provider first,
# then remove it. See docs/INCIDENT_RESPONSE.md.
name: Secret scan

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # the scanner lists the commits of a pull request

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so secrets in older commits are found too
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
