<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grocify" />
    <meta name="application-name" content="Grocify" />
    <meta name="msapplication-TileColor" content="#0b0f19" />

    <!-- Web App Manifest & PWA Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Primary Meta Tags -->
    <title>Grocify — Curated Provisions & Essentials</title>
    <meta name="title" content="Grocify — Curated Provisions & Essentials" />
    <meta name="description" content="Curated artisanal provisions, certified organic pantry staples, and everyday essentials delivered with care and speed." />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gmu2027.space/" />
    <meta property="og:site_name" content="Grocify" />
    <meta property="og:title" content="Grocify — Curated Provisions & Essentials" />
    <meta property="og:description" content="Curated artisanal provisions, certified organic pantry staples, and everyday essentials delivered with care and speed." />
    <meta property="og:image" content="https://gmu2027.space/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://gmu2027.space/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="674" />
    <meta property="og:image:alt" content="Grocify — Curated Provisions & Essentials" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://gmu2027.space/" />
    <meta name="twitter:title" content="Grocify — Curated Provisions & Essentials" />
    <meta name="twitter:description" content="Curated artisanal provisions, certified organic pantry staples, and everyday essentials delivered with care and speed." />
    <meta name="twitter:image" content="https://gmu2027.space/og-image.jpg" />
    <meta name="twitter:image:alt" content="Grocify — Curated Provisions & Essentials" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />

    <script>
      // Set the data-theme attribute before React renders and purge any legacy festival flags
      (function () {
        try {
          localStorage.removeItem('grocify_diwali');
          sessionStorage.removeItem('grocify_diwali');
          document.documentElement.removeAttribute('data-diwali');
          var t = localStorage.getItem('grocify_theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
