<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="description" content="Grocify — Curated provisions, artisanal pantry and essentials delivered fresh." />
    <title>Grocify — Curated Provisions & Essentials</title>
    <script>
      // Set the data-theme attribute before React renders,
      // so there is no flash of light theme when dark theme was chosen.
      (function () {
        try {
          var t = localStorage.getItem('grocify_theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
